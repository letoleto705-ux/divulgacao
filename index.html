<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Utilike – Tecnologia e Variedade">

      <img class="capa" src="imagens/capa.png" alt="Utilike – Tecnologia e Variedade. Tudo o que você precisa, em um só lugar!">
      <div id="avatar" class="avatar foto"><img src="imagens/logo.png" alt="Logotipo Utilike"></div>
      <h1 id="nome-loja">Utili<b>ke</b></h1>
      <p class="sub">Lista oficial de todos os produtos testados!</p>
      <nav class="social" aria-label="Redes sociais">
        <a id="s-instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.500 4.500 0 1 1 7.500 12 4.500 4.500 0 0 1 12 7.500zm0 2A2.500 2.500 0 1 0 14.500 12 2.500 2.500 0 0 0 12 9.500zM17.200 6a1.100 1.100 0 1 1-1.100 1.100A1.100 1.100 0 0 1 17.200 6z"/></svg></a>
        <a id="s-tiktok" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M16.600 2h-3.200v13.200a2.900 2.900 0 1 1-2.900-2.900c.3 0 .6 0 .8.1V9.100a6.200 6.200 0 1 0 5.300 6.100V8.600a7.500 7.500 0 0 0 4.400 1.400V6.800a4.400 4.400 0 0 1-4.400-4.800z"/></svg></a>
        <a id="s-youtube" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M21.600 7.200a2.500 2.500 0 0 0-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4A2.500 2.500 0 0 0 2.400 7.200 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.800 2.500 2.500 0 0 0 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 0 0 1.800-1.800A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.800zM10 15V9l5.200 3z"/></svg></a>
        <a id="s-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.200a8.200 8.200 0 0 1-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.1-.7.8-.8 1-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.3-.4.3-.4.8-1.400a.5.5 0 0 0 0-.5c-.1-.1-.6-1.400-.8-1.900s-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4.100c1.700.7 2.400.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.5-.3z"/></svg></a>
      </nav>
    </header>

    <a id="loja-btn" class="loja" target="_blank" rel="noopener noreferrer">
      <span>🛒 Acesse a Utili<b>ke</b> ↗</span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.500 3a7.500 7.500 0 0 1 5.900 12.100l4.300 4.300-1.400 1.400-4.300-4.300A7.500 7.500 0 1 1 10.500 3zm0 2a5.500 5.500 0 1 0 0 11 5.500 5.500 0 0 0 0-11z"/></svg>
      <input id="busca" type="search" placeholder="Pesquisar produto por nome ou tag..." autocomplete="off" aria-label="Pesquisar produto">
    </div>

    <section id="home" class="cats" aria-label="Categorias">
      <button class="cat" data-cat="recomendo">
        <span class="thumb ok"><svg viewBox="0 0 24 24"><path d="M9 16.200 4.800 12l-1.400 1.400L9 19 21 7l-1.400-1.400z"/></svg></span>
        <span class="cat-txt"><b>Produtos que RECOMENDO</b><small id="n-recomendo"></small></span>
        <span class="badge ok">RECOMENDO</span>
      </button>
      <button class="cat" data-cat="nao-recomendo">
        <span class="thumb no"><svg viewBox="0 0 24 24"><path d="M6.400 5 5 6.400 10.600 12 5 17.600 6.400 19 12 13.400 17.600 19 19 17.600 13.400 12 19 6.400 17.600 5 12 10.600z"/></svg></span>
        <span class="cat-txt"><b>Produtos que NÃO RECOMENDO</b><small id="n-nao-recomendo"></small></span>
        <span class="badge no">NÃO RECOMENDO</span>
      </button>
    </section>

    <section id="lista" class="lista" hidden>
      <button id="voltar" class="voltar">← Voltar</button>
      <h2 id="lista-titulo"></h2>
      <div id="produtos" class="produtos"></div>
      <p id="vazio" class="vazio" hidden>Nenhum produto encontrado. Tente outro nome ou tag.</p>
    </section>

    <footer class="rodape">© <span id="ano"></span> Utilike · Tecnologia e Variedade<br><small>Links de afiliado: posso receber comissão sem custo extra para você.</small></footer>
  </main>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Visualização do produto">
    <div class="modal-box">
      <button id="fechar" class="fechar" aria-label="Fechar">×</button>
      <div id="modal-midia" class="modal-midia"></div>
      <div class="modal-info">
        <h3 id="modal-nome"></h3>
        <p id="modal-veredito"></p>
        <a id="modal-cta" class="cta" target="_blank" rel="noopener noreferrer">Comprar / Ver Oferta ↗</a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
